# overcooked-kitchen generate --config configs/dataset_single.yaml --out runs/my_suite [--count N] [--splits v2_train]
# v2 kitchens (one cook): chop -> cook -> plate -> serve -> wash, soups burn. A certified core near the
# cook + distractor stations. Train / val on small-medium-large tiers; test adds larger, service-heavy tiers.
seed: 11
certificate: both              # POPF on the core and the serial schedule; the shorter valid one is kept
certificate_timeout: 20
max_tries_factor: 4
recipes:
  - {dish: tomato_soup, recipe: {tomato: 3}}
  - {dish: onion_soup, recipe: {onion: 2}}
  - {dish: carrot_soup, recipe: {carrot: 2}}
  - {dish: tomato_onion_soup, recipe: {tomato: 2, onion: 1}}
  - {dish: veggie_stew, recipe: {onion: 1, tomato: 1, carrot: 1}}
  - {dish: carrot_onion_stew, recipe: {carrot: 2, onion: 1}}

tiers_def: &tiers_train
  - name: s                      # small
    kitchen: {width: [7, 9], height: [5, 6], core_pots: 1, distractor_board: [0, 1], distractor_pot: [0, 1]}
    orders: [1, 2]
    burn: [15, 30]
  - name: m                      # medium: limited plates, a dirty pot, more distractors
    kitchen: {width: [9, 12], height: [6, 7], core_pots: [1, 2], distractor_onion: [0, 1], distractor_tomato: [0, 1],
              distractor_carrot: [0, 1], distractor_board: [1, 2], distractor_pot: [1, 2], distractor_serve: [0, 1]}
    orders: [2, 3]
    plates_clean: [1, 2]
    plates_dirty: [0, 1]
    dirty_pots: [0, 1]
    burn: [10, 25]
  - name: l                      # large
    kitchen: {width: [12, 15], height: [7, 8], walls: [0, 1], core_pots: [1, 2], distractor_onion: [1, 2],
              distractor_tomato: [1, 2], distractor_carrot: [0, 1], distractor_board: [1, 3], distractor_pot: [2, 3],
              distractor_sink: [0, 1], distractor_serve: [1, 2]}
    orders: [2, 4]
    plates_clean: [1, 2]
    plates_dirty: [0, 2]
    dirty_pots: [0, 1]
    burn: [8, 20]

splits:
  - dataset: v2_train
    count: 50
    tiers: *tiers_train
  - dataset: v2_val
    count: 10
    seed: 12
    tiers: *tiers_train
  - dataset: v2_test
    count: 15
    seed: 13
    tiers:
      - name: m
        kitchen: {width: [9, 12], height: [6, 7], core_pots: [1, 2], distractor_onion: [0, 1], distractor_tomato: [0, 1],
                  distractor_carrot: [0, 1], distractor_board: [1, 2], distractor_pot: [1, 2], distractor_serve: [0, 1]}
        orders: [2, 3]
        plates_clean: [1, 2]
        plates_dirty: [0, 1]
        dirty_pots: [0, 1]
        burn: [10, 25]
      - name: l
        kitchen: {width: [12, 15], height: [7, 8], walls: [0, 1], core_pots: [1, 2], distractor_onion: [1, 2],
                  distractor_tomato: [1, 2], distractor_carrot: [0, 1], distractor_board: [1, 3], distractor_pot: [2, 3],
                  distractor_sink: [0, 1], distractor_serve: [1, 2]}
        orders: [2, 4]
        plates_clean: [1, 2]
        plates_dirty: [0, 2]
        dirty_pots: [0, 1]
        burn: [8, 20]
      - name: xl                 # bigger than anything in training
        kitchen: {width: [15, 19], height: [8, 9], walls: [1, 2], core_pots: 2, distractor_onion: [2, 3],
                  distractor_tomato: [2, 3], distractor_carrot: [1, 2], distractor_board: [2, 4], distractor_pot: [3, 5],
                  distractor_sink: [1, 2], distractor_serve: [2, 3]}
        orders: [3, 5]
        plates_clean: [1, 3]
        plates_dirty: [0, 2]
        dirty_pots: [0, 2]
        burn: [8, 20]
      - name: service            # many orders, few plates, deadlines
        kitchen: {width: [11, 14], height: [6, 8], core_pots: 2, distractor_board: [1, 2], distractor_pot: [1, 3],
                  distractor_serve: [1, 2]}
        orders: [4, 6]
        plates_clean: [1, 2]
        plates_dirty: [0, 1]
        dirty_pots: [0, 1]
        burn: [10, 20]
        deadline: {rho: [1.0, 1.15]}
