# python -m overcooked_ai.make_dataset configs/dataset_train.yaml --probe 20
# T-iFLAX train split: small certified kitchens WITH distractors, so pruning has something to learn,
# but small enough that the full problem is usually solvable in training (labels need plans).
# Same generator and core/distractor construction as configs/dataset_stress.yaml; disjoint seed
# (train 101, val 202, stress 7). Sizes sit below the stress test tiers (t1_medium starts at 11x6).
dataset: train
seed: 101
kind: kitchen
recipes: [{onion: 3}, {onion: 3}, {onion: 2, tomato: 1}]
cook_time: [10, 20]
counters: shared
deadline: {mode: plan, rho: [1.0, 1.15]}
certificate: popf_then_serial
certificate_timeout: 15
max_tries_factor: 10
tiers:
  - name: s                        # small: 1-3 distractor stations, 2 cooks
    count: 20
    kitchen: {width: [8, 10], height: [5, 6], walls: [0, 1], core_pots: 1,
              distractor_pot: [1, 2], distractor_onion: [0, 1], distractor_dish: [0, 1], distractor_serve: [0, 1]}
    cooks: 2
    core_cooks: [1, 2]
    orders: [1, 2]
  - name: m                        # medium: 3-6 distractor stations, 2-3 cooks
    count: 20
    kitchen: {width: [9, 12], height: [5, 7], walls: [0, 1], core_pots: 1,
              distractor_pot: [1, 3], distractor_onion: [1, 2], distractor_tomato: [0, 1],
              distractor_dish: [0, 1], distractor_serve: [1, 1]}
    cooks: [2, 3]
    core_cooks: [1, 2]
    orders: [2, 3]
