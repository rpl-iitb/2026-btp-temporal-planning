# python -m overcooked_ai.make_dataset configs/dataset_random_small.yaml
# Small random kitchens without distractors (the full problem is the core): quick sanity / training data.
# Value formats: 3 (fixed) | [lo, hi] (uniform, ints inclusive) | [a, b, c] (choice).
dataset: random_small
seed: 0
tiers:
  - name: small
    kind: kitchen
    count: 10
    kitchen: {width: [7, 10], height: [5, 7], walls: [0, 1], split_prob: 0.0, core_pots: [1, 2]}
    cooks: [1, 3]
    orders: [1, 3]
    recipes: [{onion: 3}, {onion: 2, tomato: 1}]
    cook_time: [10, 20]
    counters: shared
    deadline: {mode: plan, rho: [1.0, 1.3]}
    certificate_timeout: 20
