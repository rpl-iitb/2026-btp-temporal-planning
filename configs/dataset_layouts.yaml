# python -m overcooked_ai.make_dataset configs/dataset_layouts.yaml
# The standard Overcooked-AI 1.1.0 layouts with varied cooks / pots / orders / deadlines.
dataset: layouts
seed: 1
tiers:
  - name: std
    kind: layouts
    count: 10
    layouts: [cramped_room, asymmetric_advantages, coordination_ring, forced_coordination,
              counter_circuit_o_1order, corridor, large_room, multiplayer_schelling]
    cooks: [1, 3]
    pots: [1, 2]
    orders: [1, 3]
    recipes: [{onion: 3}]
    cook_time: 20
    counters: shared
    deadline: {mode: plan, rho: [1.0, 1.2]}
    certificate_timeout: 30
