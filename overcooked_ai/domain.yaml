# Overcooked-AI 1.1.0 (commit a60e31a) as a PDDL 2.1 temporal domain.
#
# Time unit = one simulator timestep. A PDDL time t corresponds to simulator
# state index t; an action [s, s+d] occupies transitions s .. s+d-1 and its
# end effects are visible in state s+d. Derivations (and what is abstracted
# away) are in overcooked_ai/README.md.
name: overcooked-v1
doc: >
  Station-level abstraction of Overcooked-AI 1.1.0. Cooks move between
  interaction poses (floor tile + facing direction) with exact single-agent
  shortest-path durations, hold one item, and interact with dispensers, pots,
  counters and serving windows. Pots are machines that cook autonomously once
  a cook starts them. Orders are goals with optional deadlines.

requirements: [":typing", ":durative-actions", ":fluents", ":timed-initial-literals"]

types:
  cook: object
  pose: object          # floor tile + facing; the place a cook interacts from
  tile: object          # floor tile; unary occupancy resource
  station: object
  pot: station
  dispenser: station    # onion / tomato / dish dispenser (what it gives: provides)
  serving: station
  counter: station      # only counters selected by the scenario's counter policy
  item: object
  ingredient: item
  recipe: object        # soup composition (onions, tomatoes)
  count: object         # 0..max_ingredients, for pot contents
  order: object

constants:
  onion: ingredient
  tomato: ingredient
  dish: item

predicates:
  # cooks
  at: "?c - cook ?l - pose"
  idle: "?c - cook"                       # unary resource: one action per cook at a time
  hand-empty: "?c - cook"
  holding: "?c - cook ?i - item"
  holding-soup: "?c - cook ?r - recipe"
  # space
  free: "?t - tile"                       # no cook on / heading to this tile
  pose-tile: "?l - pose ?t - tile"        # static
  faces: "?l - pose ?s - station"         # static: interacting from ?l reaches ?s
  connected: "?a - pose ?b - pose"        # static: reachable, different tiles
  same-tile: "?a - pose ?b - pose"        # static: same tile, different facing
  # dispensers
  provides: "?s - dispenser ?i - item"    # static
  # pots
  pot-idle: "?p - pot"                    # accepting ingredients (not cooking, no ready soup)
  pot-has: "?p - pot ?no - count ?nt - count"
  next: "?a - count ?b - count"           # static: b = a + 1
  fits: "?no - count ?nt - count"         # static: no + nt <= max_ingredients
  is-zero: "?n - count"                   # static
  recipe-of: "?r - recipe ?no - count ?nt - count"   # static
  cooking: "?p - pot ?r - recipe"         # started; the pot's cook action has not run yet
  soup-ready: "?p - pot ?r - recipe"
  # counters
  counter-empty: "?k - counter"
  counter-holds: "?k - counter ?i - item"
  counter-soup: "?k - counter ?r - recipe"
  # orders
  order-recipe: "?o - order ?r - recipe"  # static
  pending: "?o - order"                   # not yet delivered
  open: "?o - order"                      # delivery window; a timed literal closes it at the deadline
  served: "?o - order"

functions:
  travel: "?a - pose ?b - pose"           # steps; exact single-agent shortest path incl. turning
  cook-steps: "?r - recipe"               # recipe cook time - 1 (start interact counts as step 1)

# Deadlines on (served ?o) goals are encoded by deleting (open ?o) at
# deadline + til_offset. deliver needs (open ?o) over all, so its end must be
# <= deadline (+ the planner's epsilon drift, which must stay < til_offset).
deadline_encoding:
  goal_predicate: served
  window_predicate: open
  til_offset: 0.5

actions:
  - name: move
    doc: Walk to a pose on another tile. Reserves the target tile at start, releases the old one.
    params: "?c - cook ?from - pose ?to - pose ?t1 - tile ?t2 - tile"
    duration: "travel ?from ?to"
    condition:
      at_start: ["at ?c ?from", "idle ?c", "free ?t2"]
      over_all: ["connected ?from ?to", "pose-tile ?from ?t1", "pose-tile ?to ?t2"]
    effect:
      at_start: ["not at ?c ?from", "not idle ?c", "not free ?t2", "free ?t1"]
      at_end: ["at ?c ?to", "idle ?c"]
    sim: {kind: navigate, actor: "?c", to: "?to"}

  - name: turn
    doc: Face another station from the same tile (moving into a non-floor cell only turns).
    params: "?c - cook ?from - pose ?to - pose"
    duration: "travel ?from ?to"
    condition:
      at_start: ["at ?c ?from", "idle ?c"]
      over_all: ["same-tile ?from ?to"]
    effect:
      at_start: ["not at ?c ?from", "not idle ?c"]
      at_end: ["at ?c ?to", "idle ?c"]
    sim: {kind: navigate, actor: "?c", to: "?to"}

  - name: take
    doc: Take an onion / tomato / dish from a dispenser (empty hand).
    params: "?c - cook ?l - pose ?s - dispenser ?i - item"
    duration: 1
    condition:
      at_start: ["idle ?c", "hand-empty ?c"]
      over_all: ["at ?c ?l", "faces ?l ?s", "provides ?s ?i"]
    effect:
      at_start: ["not idle ?c", "not hand-empty ?c"]
      at_end: ["holding ?c ?i", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?s"}

  - name: add-onion
    doc: Put a held onion into an idle pot that has room.
    params: "?c - cook ?l - pose ?p - pot ?a - count ?b - count ?n - count"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding ?c onion", "pot-idle ?p", "pot-has ?p ?a ?n"]
      over_all: ["at ?c ?l", "faces ?l ?p", "next ?a ?b", "fits ?b ?n"]
    effect:
      at_start: ["not idle ?c", "not holding ?c onion", "not pot-has ?p ?a ?n"]
      at_end: ["pot-has ?p ?b ?n", "hand-empty ?c", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?p"}

  - name: add-tomato
    doc: Put a held tomato into an idle pot that has room.
    params: "?c - cook ?l - pose ?p - pot ?n - count ?a - count ?b - count"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding ?c tomato", "pot-idle ?p", "pot-has ?p ?n ?a"]
      over_all: ["at ?c ?l", "faces ?l ?p", "next ?a ?b", "fits ?n ?b"]
    effect:
      at_start: ["not idle ?c", "not holding ?c tomato", "not pot-has ?p ?n ?a"]
      at_end: ["pot-has ?p ?n ?b", "hand-empty ?c", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?p"}

  - name: start-cooking
    doc: >
      Empty-handed interact with an idle, non-empty pot (Overcooked 1.1.0 does
      not auto-start full pots). Only compositions of ordered recipes are allowed.
    params: "?c - cook ?l - pose ?p - pot ?r - recipe ?no - count ?nt - count"
    duration: 1
    condition:
      at_start: ["idle ?c", "hand-empty ?c", "pot-idle ?p", "pot-has ?p ?no ?nt"]
      over_all: ["at ?c ?l", "faces ?l ?p", "recipe-of ?r ?no ?nt"]
    effect:
      at_start: ["not idle ?c", "not pot-idle ?p", "not pot-has ?p ?no ?nt"]
      at_end: ["cooking ?p ?r", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?p"}

  - name: cook
    doc: The pot (a machine) cooks by itself; no cook is held.
    params: "?p - pot ?r - recipe"
    duration: "cook-steps ?r"
    condition:
      at_start: ["cooking ?p ?r"]
    effect:
      at_start: ["not cooking ?p ?r"]
      at_end: ["soup-ready ?p ?r"]
    sim: {kind: autonomous, station: "?p"}

  - name: pick-soup
    doc: Scoop a ready soup into a held dish; the pot becomes empty and idle.
    params: "?c - cook ?l - pose ?p - pot ?r - recipe ?z - count"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding ?c dish", "soup-ready ?p ?r"]
      over_all: ["at ?c ?l", "faces ?l ?p", "is-zero ?z"]
    effect:
      at_start: ["not idle ?c", "not holding ?c dish", "not soup-ready ?p ?r"]
      at_end: ["holding-soup ?c ?r", "pot-idle ?p", "pot-has ?p ?z ?z", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?p"}

  - name: deliver
    doc: Hand a soup in at a serving window for an open, pending order of that recipe.
    params: "?c - cook ?l - pose ?s - serving ?o - order ?r - recipe"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding-soup ?c ?r", "pending ?o"]
      over_all: ["at ?c ?l", "faces ?l ?s", "order-recipe ?o ?r", "open ?o"]
    effect:
      at_start: ["not idle ?c", "not holding-soup ?c ?r", "not pending ?o"]
      at_end: ["served ?o", "hand-empty ?c", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?s"}

  - name: put-down
    doc: Place a held item on an empty counter (hand-offs between cooks).
    params: "?c - cook ?l - pose ?k - counter ?i - item"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding ?c ?i", "counter-empty ?k"]
      over_all: ["at ?c ?l", "faces ?l ?k"]
    effect:
      at_start: ["not idle ?c", "not holding ?c ?i", "not counter-empty ?k"]
      at_end: ["counter-holds ?k ?i", "hand-empty ?c", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?k"}

  - name: pick-up
    doc: Take an item from a counter (empty hand).
    params: "?c - cook ?l - pose ?k - counter ?i - item"
    duration: 1
    condition:
      at_start: ["idle ?c", "hand-empty ?c", "counter-holds ?k ?i"]
      over_all: ["at ?c ?l", "faces ?l ?k"]
    effect:
      at_start: ["not idle ?c", "not hand-empty ?c", "not counter-holds ?k ?i"]
      at_end: ["holding ?c ?i", "counter-empty ?k", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?k"}

  - name: put-down-soup
    doc: Place a held soup on an empty counter.
    params: "?c - cook ?l - pose ?k - counter ?r - recipe"
    duration: 1
    condition:
      at_start: ["idle ?c", "holding-soup ?c ?r", "counter-empty ?k"]
      over_all: ["at ?c ?l", "faces ?l ?k"]
    effect:
      at_start: ["not idle ?c", "not holding-soup ?c ?r", "not counter-empty ?k"]
      at_end: ["counter-soup ?k ?r", "hand-empty ?c", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?k"}

  - name: pick-up-soup
    doc: Take a soup from a counter (empty hand).
    params: "?c - cook ?l - pose ?k - counter ?r - recipe"
    duration: 1
    condition:
      at_start: ["idle ?c", "hand-empty ?c", "counter-soup ?k ?r"]
      over_all: ["at ?c ?l", "faces ?l ?k"]
    effect:
      at_start: ["not idle ?c", "not hand-empty ?c", "not counter-soup ?k ?r"]
      at_end: ["holding-soup ?c ?r", "counter-empty ?k", "idle ?c"]
    sim: {kind: interact, actor: "?c", pose: "?l", station: "?k"}
