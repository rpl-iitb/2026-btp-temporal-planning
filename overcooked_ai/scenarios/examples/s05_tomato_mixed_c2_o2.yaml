scenario_id: s05_tomato_mixed_c2_o2
description: >
  simple_tomato with two different recipes (1 onion + 2 tomatoes, and 3
  tomatoes) and a shorter cook time. Exercises add-tomato, recipe matching
  at start-cooking and deliver, and scenario overrides of simulator params.
layout: {name: simple_tomato}
cooks: 2
sim: {cook_time: 10}
orders:
  - recipe: {onion: 1, tomato: 2}
  - recipe: {tomato: 3}
    deadline: 90
