[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal_planning"
version = "1.0.0"
description = "T-iFLAX: learned object reduction for temporal planning (Overcooked-AI 1.1.0 benchmark)"
requires-python = ">=3.10"
dependencies = ["numpy<2", "pyyaml", "jsonschema", "psutil", "torch", "pandas", "matplotlib"]

[project.optional-dependencies]
experiments = ["ortools"]          # algorithm/experiments.py cp_select only

[tool.setuptools.packages.find]
include = ["pddl_generator", "overcooked_ai", "algorithm", "baselines"]

[tool.setuptools.package-data]
pddl_generator = ["*.json"]
overcooked_ai = ["*.json", "*.yaml"]
