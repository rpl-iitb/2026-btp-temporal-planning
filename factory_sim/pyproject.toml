[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-sim"
version = "2.0.0"
description = "FactorySim: a smart-factory benchmark for multi-robot temporal planning, scheduling and reinforcement learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.22", "pyyaml>=6", "gymnasium>=0.29", "pillow>=9"]

[project.optional-dependencies]
marl = ["pettingzoo>=1.24"]
exact = ["ortools>=9.8"]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7"]
rl = ["sb3-contrib>=2.0", "stable-baselines3>=2.0"]
all = ["pettingzoo>=1.24", "ortools>=9.8", "matplotlib>=3.5", "pytest>=7"]

[project.scripts]
factory-sim = "factory_sim.cli:main"

[tool.setuptools.packages.find]
include = ["factory_sim*"]

[tool.setuptools.package-data]
factory_sim = ["configs/*.yaml"]
